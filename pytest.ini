[pytest]
# 스위트를 패키지로 두고 저장소 루트만 import 경로에 넣는다.
#
# 스위트마다 pages/ · data/ 를 각자 갖고 있어서, 예전처럼 각 스위트 디렉터리를
# 통째로 sys.path 에 넣으면 `pages` 라는 이름이 겹친다. 먼저 올라간 쪽이 이기고
# 다른 스위트는 조용히 남의 페이지 객체를 import 한다 — 찾기 아주 어려운 종류의 고장이다.
# 그래서 `naver_weather.pages` 처럼 스위트 이름으로 한정한다.
pythonpath = .

testpaths = naver_weather/tests

addopts =
    -ra
    --strict-markers
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results

markers =
    contract: 화면이 우리와 맺은 계약 — 필드가 있는가, 형태가 맞는가
    range: 값이 물리적으로 가능한 범위인가
    consistency: 두 화면·두 값이 서로 어긋나지 않는가

# 파라미터 id 를 한글 그대로 출력한다. 이걸 끄지 않으면 어느 지역이
# 실패했는지 결과만 보고 알 수 없다.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
