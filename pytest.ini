[pytest]
# 스위트를 패키지로 두고 저장소 루트만 import 경로에 넣는다.
#
# 스위트마다 pages/ · data/ 를 각자 갖고 있어서, 예전처럼 각 스위트 디렉터리를
# 통째로 sys.path 에 넣으면 `pages` 라는 이름이 겹친다. 먼저 올라간 쪽이 이기고
# 다른 스위트는 조용히 남의 페이지 객체를 import 한다 — 찾기 아주 어려운 종류의 고장이다.
# 그래서 `naver_weather.pages` · `saucedemo.pages` 처럼 스위트 이름으로 한정한다.
pythonpath = .

testpaths =
    naver_weather/tests
    saucedemo/tests

addopts =
    -ra
    --strict-markers
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results

# --strict-markers 를 켠 이상 마커는 전부 여기 모인다.
# 스위트별 conftest 에 흩어두면 오타가 그냥 통과한다.
markers =
    # naver_weather — 실패했을 때 어느 갈래인지 바로 갈리게 나눴다
    contract: 화면이 우리와 맺은 계약 — 필드가 있는가, 형태가 맞는가
    range: 값이 물리적으로 가능한 범위인가
    consistency: 두 화면·두 값이 서로 어긋나지 않는가
    # saucedemo
    defect: 알려진 제품 결함을 고정해 둔 테스트 (saucedemo/docs/DEFECTS.md 참조)
    slow: 응답 지연 계정을 쓰는 테스트

# 파라미터 id 를 한글 그대로 출력한다. 이걸 끄지 않으면 어느 지역·어느 계정이
# 실패했는지 결과만 보고 알 수 없다.
# (옵션 이름이 저렇게 긴 것은 pytest 쪽 의도다 — 이름 그대로 써야 동작한다)
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
